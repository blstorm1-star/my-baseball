name: 기록 자동 업데이트

on:
  schedule:
    # 한국시간 토·일·월 밤 9시 (GitHub 는 UTC 기준: 12:00 UTC = 21:00 KST)
    - cron: "0 12 * * 6,0,1"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow' 로 언제든 수동 실행

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 리그 사이트에서 기록 가져오기
        run: python update.py
      - name: 바뀐 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data.json docs
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "기록 업데이트 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
